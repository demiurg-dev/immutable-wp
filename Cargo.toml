[package]
name = "iwp"
version = "0.1.0"
edition = "2024"
description = "Immutable WordPress hosting with nginx, podman and MariaDB"
license = "MIT"
repository = "https://github.com/demiurg-dev/immutable-wp"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
hex = "0.4.3"
include_dir = "0.7.4"
jiff = "0.2.37"
libc = "0.2.189"
md-5 = "0.11.0"
minijinja = { version = "2.24.0", features = ["loader"] }
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
