# Generated by iwp for site acme. Do not edit: run `iwp nginx apply acme`.
# Include inside the server {} block(s) for: www.example.org, shop.example.org, dev.example.org
# Rule order matters (first matching regex location wins) and is fixed by iwp.

root /var/www/vhosts/example.org/iwp/current;
index index.html;
# A site can create symlinks in its writable directories. Below the release root nginx only
# follows a symlink whose owner also owns its target: the release's own links into shared/
# (owned by the site's UID, like their targets) work, links to anyone else's files do not.
disable_symlinks if_not_owner from=$document_root;

# 1. Hidden files, core docs, config, logs and dumps are never served.
location ~ /\.(?!well-known/) { deny all; }
location = /readme.html { deny all; }
location = /license.txt { deny all; }
location = /wp-config.php { deny all; }
location = /wp-config-sample.php { deny all; }
location = /xmlrpc.php { deny all; }
location ~* ^/wp-content/.*\.(?:log|sql|gz|zip)$ { deny all; }
location ~* (?:^|/)composer\.(?:json|lock)$ { deny all; }

# 2. PHP never runs from writable directories.
location ~* ^/wp-content/(?:uploads|wflogs)/.*\.(?:php[0-9]?|phtml|phar)$ { deny all; }

# 3. WP-Cron runs from the iwp-acme-cron timer.
location = /wp-cron.php { return 404; }

# 4. PHP entry points. Nothing else reaches PHP-FPM.
location ~ ^/wp-admin/(?:network/|user/)?$ { rewrite ^(.*)$ $1index.php last; }
location ~ ^/(?:index|wp-login|wp-signup|wp-activate|wp-comments-post|wp-trackback|wp-links-opml|wp-mail)\.php$ { include iwp/acme.fastcgi.conf; }
location ~ ^/wp-admin/(?:network/|user/)?[a-z0-9_-]+\.php$ { include iwp/acme.fastcgi.conf; }

# 5. Any other PHP URL does not exist.
location ~* \.(?:php[0-9]?|phtml|phar)$ { return 404; }

# 6. Static assets: long cache when versioned (?ver=), a week otherwise.
location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|pdf)$ {
    expires 7d;
    if ($arg_ver) { expires max; }
    log_not_found off;
    access_log off;
}

# 7. Everything else is a WordPress route.
location / { try_files $uri /index.php?$args; }
