; iwp php-fpm pool (replaces the image's zz-docker.conf; site sizing: zz-site.conf)
[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = /run/iwp/php.sock
listen.mode = 0666
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
php_admin_value[open_basedir] = /var/www/html:/tmp:/run/secrets:/etc/iwp
php_admin_flag[allow_url_include] = off
